name: Cloudflare Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: cloudflare-preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Build preview alias from branch name
        id: alias
        run: |
          alias=$(printf '%s' "${{ github.head_ref }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g; s/-\+/-/g; s/^-//; s/-$//; s/^[0-9]\+//' \
            | cut -c1-50)
          echo "alias=${alias:-preview}" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(npx -y wrangler@4 versions upload --env preview --preview-alias "${{ steps.alias.outputs.alias }}")
          url=$(printf '%s\n' "$output" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | tail -1 || true)
          echo "preview-url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview-url }}
        run: |
          if [ -n "$PREVIEW_URL" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "Preview deployment: $PREVIEW_URL"
          fi