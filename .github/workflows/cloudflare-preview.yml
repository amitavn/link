name: Cloudflare Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: cloudflare-preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Build preview alias from branch name
        id: alias
        run: |
          alias=$(printf '%s' "${{ github.head_ref }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g; s/-\+/-/g; s/^-//; s/-$//; s/^[0-9]\+//' \
            | cut -c1-50)
          echo "alias=${alias:-preview}" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx -y wrangler@4 versions upload --env preview --preview-alias "${{ steps.alias.outputs.alias }}" \
            2>&1 | tee "$RUNNER_TEMP/wrangler-upload.log"
          status=${PIPESTATUS[0]}
          set -e

          commit_url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-upload.log" \
            | head -1 || true)
          branch_url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-upload.log" \
            | tail -1 || true)
          echo "branch-url=${branch_url}" >> "$GITHUB_OUTPUT"
          echo "commit-url=${commit_url}" >> "$GITHUB_OUTPUT"

          if [ "$status" -eq 0 ] && { [ -z "$branch_url" ] || [ -z "$commit_url" ]; }; then
            echo "Preview upload succeeded but preview URLs were not found" >&2
            status=1
          fi

          exit "$status"

      - name: Update preview status comment
        if: ${{ always() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        uses: actions/github-script@v7
        env:
          BRANCH_URL: ${{ steps.upload.outputs.branch-url }}
          COMMIT_URL: ${{ steps.upload.outputs.commit-url }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- cloudflare-preview -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7)
            const branchUrl = process.env.BRANCH_URL || ''
            const commitUrl = process.env.COMMIT_URL || ''
            const succeeded = process.env.UPLOAD_OUTCOME === 'success' && branchUrl && commitUrl
            const body = succeeded
              ? `${marker}\n### Preview Deployment\nBranch URL: [${branchUrl.replace(/^https?:\/\//, '')}](${branchUrl})\nCommit URL: [${commitUrl.replace(/^https?:\/\//, '')}](${commitUrl})`
              : `${marker}\n### Preview Deployment\n❌ Preview deployment failed for \`${shortSha}\`.\n\n[View workflow run](${runUrl})`

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(comment => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
